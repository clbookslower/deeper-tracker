// ── Supabase REST API ────────────────────────────────────────────
const sbFetch = async (table, method = "GET", body = null, filters = {}) => {
  const url = new URL(`${SUPABASE_URL}/rest/v1/${table}`);
  Object.entries(filters).forEach(([k, v]) => url.searchParams.append(k, v));
  const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": `Bearer ${SUPABASE_KEY}`,
    "Content-Type": "application/json"
  };
  if (method === "POST") headers["Prefer"] = "resolution=merge-duplicates,return=minimal";
  const res = await fetch(url.toString(), {
    method,
    headers,
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) throw new Error(`${res.status}: ${await res.text()}`);
  const text = await res.text();
  return text ? JSON.parse(text) : null;
};

        name: `eq.${name}`,

      });

        localStorage.setItem(`dp:d:${r.date}`, JSON.stringify(r.data));

  }
  return dates.map(date => {
    if (map[date]) return {
      ...INIT_DAY(),
      ...map[date]
    };
    const cached = localStorage.getItem(`dp:d:${date}`);
    return cached ? {
      ...INIT_DAY(),
      ...JSON.parse(cached)

  });
